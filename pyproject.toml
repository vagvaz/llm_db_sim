[project]
name = "agent-db-sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Evangelos Vazaios", email = "vagvaz@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "simpy>=4.1.1,<5",
    "typer>=0.12,<1",
    "omegaconf>=2.3,<3",
    "pyvcd>=0.5.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "plotly>=7.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8,<9",
]

[project.scripts]
agent-db-sim = "agent_db_sim.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
