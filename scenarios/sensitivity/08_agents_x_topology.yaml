# 08_agents_x_topology.yaml — sensitivity sweep 8: load x wiring interaction.
#
# Same grounded base as 01_agents_x_inference.yaml (see its header).
# THE key 2-way of the study: the topology ranking at 16 agents (file 03)
# re-asked at 64 agents, where per-node DB capacity is 4x more contended:
#
#   agents.count [16, 64] x db.topology [centralized, disaggregated,
#   distributed] = 6 runs. The (16, centralized) cell duplicates the
#   file 03/07 daughter baseline — kept as a cross-file determinism check.
#
# Sub-question (b): what scale-out relieves and at which load does the
# ranking change. sim.until 600 (shared constant: at 64 agents one call
# takes ~500 u under the 10k tok/s cap, so shorter untils censor the tail).
# runs/sensitivity/sens-agents-topology/.

sim:
  until: 600.0
  seed: 701

agents:
  count: 16                     # swept: 16 | 64
  input_tokens:
    distribution: lognormal
    mean: 11.0
    sigma: 0.6
  output_tokens:
    distribution: lognormal
    mean: 7.36
    sigma: 1.0
  query_profiles:
    - name: point_lookup
      complexity: 0.005
      volume: 0.0001
      weight: 0.45
    - name: small_analytic
      complexity: 1.5
      volume: 0.5
      weight: 0.20
    - name: join_heavy
      complexity: 12.0
      volume: 4.0
      weight: 0.10
    - name: wide_scan_aggregate
      complexity: 20.0
      volume: 0.75
      weight: 0.10
    - name: oltp_tx
      complexity: 0.02
      volume: 0.0002
      weight: 0.15

llm:
  slots: 32
  input_tokens_per_s: 8000
  output_tokens_per_s: 2000
  ingress: fifo

db:
  topology: centralized         # swept: centralized | disaggregated | distributed
  compute_nodes: 4              # no-op on centralized
  storage_nodes: 2
  coordinators: 2
  compute:
    slots: 4
    ingress: fifo
    issue_ratio: 0.2
    phase_split: three_phase
  storage:
    backend: ssd_enterprise
  network:
    latency: 0.0005
    bandwidth: 25.0
    capacity: 8.0
    request_size: 0.01
    coordinator_overhead: 1.2

metrics:
  warmup: 0.1

sweep:
  name: sens-agents-topology
  factors:
    agents.count: [16, 64]
    db.topology: [centralized, disaggregated, distributed]
