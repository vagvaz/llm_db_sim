# 06_distributed_coordinators.yaml — sensitivity sweep 6: coordinator fan-in.
#
# Same grounded base as 01_agents_x_inference.yaml (see its header).
# Distributed topology coordinator axis: coordinators C in {1, 2} at the
# fixed N=4 (every C < N here is valid). Entry through C coordinators —
# queries round-robin across them and each coordinator pays the 1.2x
# overhead multiplier while fronting every peer; more coordinators spread
# the coordinator compute but leave peer capacity unchanged.
# sim.until 600 (shared constant, see 03). runs/sensitivity/sens-dist-coordinators/ — 2 runs.

sim:
  until: 600.0
  seed: 701

agents:
  count: 16
  input_tokens:
    distribution: lognormal
    mean: 11.0
    sigma: 0.6
  output_tokens:
    distribution: lognormal
    mean: 7.36
    sigma: 1.0
  query_profiles:
    - name: point_lookup
      complexity: 0.005
      volume: 0.0001
      weight: 0.45
    - name: small_analytic
      complexity: 1.5
      volume: 0.5
      weight: 0.20
    - name: join_heavy
      complexity: 12.0
      volume: 4.0
      weight: 0.10
    - name: wide_scan_aggregate
      complexity: 20.0
      volume: 0.75
      weight: 0.10
    - name: oltp_tx
      complexity: 0.02
      volume: 0.0002
      weight: 0.15

llm:
  slots: 32
  input_tokens_per_s: 8000
  output_tokens_per_s: 2000
  ingress: fifo

db:
  topology: distributed
  compute_nodes: 4
  storage_nodes: 2
  coordinators: 1               # swept: 1 | 2 (of 4 nodes; must be < compute_nodes)
  compute:
    slots: 4
    ingress: fifo
    issue_ratio: 0.2
    phase_split: three_phase
  storage:
    backend: ssd_enterprise
  network:
    latency: 0.0005
    bandwidth: 25.0
    capacity: 8.0
    request_size: 0.01
    coordinator_overhead: 1.2

metrics:
  warmup: 0.1

sweep:
  name: sens-dist-coordinators
  factors:
    db.coordinators: [1, 2]
