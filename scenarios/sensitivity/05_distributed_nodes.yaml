# 05_distributed_nodes.yaml — sensitivity sweep 5: distributed node count.
#
# Same grounded base as 01_agents_x_inference.yaml (see its header).
# Distributed topology node-count axis: N in {2, 4} peers behind a single
# coordinator (coordinators fixed at 1 — the coordinator axis is file 06).
# More nodes = more colocated compute+storage budgets, but every peer
# query pays the coordinator hop with the 1.2x overhead multiplier.
# sim.until 600 (shared constant, see 03). runs/sensitivity/sens-dist-nodes/ — 2 runs.

sim:
  until: 600.0
  seed: 701

agents:
  count: 16
  input_tokens:
    distribution: lognormal
    mean: 11.0
    sigma: 0.6
  output_tokens:
    distribution: lognormal
    mean: 7.36
    sigma: 1.0
  query_profiles:
    - name: point_lookup
      complexity: 0.005
      volume: 0.0001
      weight: 0.45
    - name: small_analytic
      complexity: 1.5
      volume: 0.5
      weight: 0.20
    - name: join_heavy
      complexity: 12.0
      volume: 4.0
      weight: 0.10
    - name: wide_scan_aggregate
      complexity: 20.0
      volume: 0.75
      weight: 0.10
    - name: oltp_tx
      complexity: 0.02
      volume: 0.0002
      weight: 0.15

llm:
  slots: 32
  input_tokens_per_s: 8000
  output_tokens_per_s: 2000
  ingress: fifo

db:
  topology: distributed
  compute_nodes: 4              # swept: 2 | 4 (node count; coordinator fixed below)
  storage_nodes: 2              # unused on distributed (storage is node-local)
  coordinators: 1               # must be < compute_nodes
  compute:
    slots: 4
    ingress: fifo
    issue_ratio: 0.2
    phase_split: three_phase
  storage:
    backend: ssd_enterprise
  network:
    latency: 0.0005
    bandwidth: 25.0
    capacity: 8.0
    request_size: 0.01
    coordinator_overhead: 1.2

metrics:
  warmup: 0.1

sweep:
  name: sens-dist-nodes
  factors:
    db.compute_nodes: [2, 4]
